name: Publish to npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Wait for CI success on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const { setTimeout: sleep } = require('node:timers/promises');

          const repository = process.env.REPOSITORY;
          const sha = process.env.SHA;
          const token = process.env.GH_TOKEN;
          const headers = {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${token}`,
            'User-Agent': 'flex-rate-limit-release-gate',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          async function request(path) {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, { headers });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status}: ${await response.text()}`);
            }
            return response.json();
          }

          async function main() {
            for (let attempt = 0; attempt < 60; attempt += 1) {
              const data = await request(`/actions/workflows/ci.yml/runs?head_sha=${sha}&event=push&per_page=20`);
              const runs = data.workflow_runs || [];
              const completed = runs.find((run) => run.status === 'completed');
              const active = runs.find((run) => run.status === 'in_progress' || run.status === 'queued' || run.status === 'waiting');

              if (completed?.conclusion === 'success') {
                console.log(`CI passed for ${sha}: ${completed.html_url}`);
                return;
              }

              if (completed && completed.conclusion !== 'success') {
                throw new Error(`CI did not pass for ${sha}: ${completed.conclusion}\n${completed.html_url}`);
              }

              if (active) {
                console.log(`Waiting for CI (${active.status}): ${active.html_url}`);
              } else {
                console.log(`Waiting for CI run for ${sha}`);
              }
              await sleep(15000);
            }

            throw new Error(`Timed out waiting for CI success for ${sha}`);
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Preview package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
